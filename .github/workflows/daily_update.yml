name: Daily Indian Index Valuation Sync

on:
  schedule:
    # Runs at 13:00 UTC (6:30 PM IST) Monday through Friday
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch NSE & BSE EOD Valuation Multiples
        run: python update_valuations.py

      - name: Commit and push updated JSON feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add valuation_data.json
          git diff --staged --quiet || (git commit -m "chore: update EOD index valuations ($(date -u +'%Y-%m-%d'))" && git push)
